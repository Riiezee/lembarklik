name: Build desktop Windows
on:
  push:
    branches: [build/windows-desktop]
    paths: ['.github/workflows/build-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Ekstrak sumber LembarKlik
        run: Expand-Archive -LiteralPath LembarKlik.zip -DestinationPath source
      - name: Instal dependensi dan build
        working-directory: source/LembarKlik
        run: |
          python -m pip install -r requirements.txt -r requirements-desktop.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name LembarKlik --add-data "lembarklik/web:lembarklik/web" --collect-all pypdfium2_raw --collect-data webview --collect-data pdfminer --collect-data docx --collect-data pptx --collect-data openpyxl desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Periksa dan kemas aplikasi
        working-directory: source/LembarKlik
        run: |
          @'
          import struct
          from pathlib import Path
          from shutil import make_archive

          folder = Path("dist/LembarKlik")
          exe = (folder / "LembarKlik.exe").read_bytes()
          assert exe[:2] == b"MZ"
          header = struct.unpack_from("<I", exe, 0x3C)[0]
          assert exe[header:header + 4] == b"PE\x00\x00"
          assert struct.unpack_from("<H", exe, header + 4)[0] == 0x8664
          internal = folder / "_internal"
          assert (internal / "lembarklik/web/index.html").is_file()
          assert any(internal.rglob("pdfium.dll"))
          assert any(internal.rglob("Microsoft.Web.WebView2.Core.dll"))
          make_archive("dist/LembarKlik-Windows-x64", "zip", "dist", "LembarKlik")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LembarKlik-Windows-x64
          path: source/LembarKlik/dist/LembarKlik-Windows-x64.zip
          if-no-files-found: error
